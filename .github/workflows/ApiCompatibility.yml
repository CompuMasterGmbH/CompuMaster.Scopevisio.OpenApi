name: Compiled API Compatibility (Offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            6.0.x
      - name: Compare compiled API and run unchanged isolated consumers
        shell: pwsh
        run: python tools/verify_api_compatibility.py --work-dir "${{ runner.temp }}/openscope-api-compat"
      - name: Retain compatibility evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-api-compatibility
          path: |
            ${{ runner.temp }}/openscope-api-compat/report.json
            ${{ runner.temp }}/openscope-api-compat/**/*.log
          if-no-files-found: warn
          retention-days: 14
