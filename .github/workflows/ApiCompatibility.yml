name: Compiled API Compatibility (Offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            6.0.x
      - name: Compare compiled API and run unchanged isolated consumers
        shell: pwsh
        run: python tools/verify_api_compatibility.py --work-dir "${{ runner.temp }}/openscope-api-compat"
      - name: Retain compatibility evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-api-compatibility
          path: |
            ${{ runner.temp }}/openscope-api-compat/report.json
            ${{ runner.temp }}/openscope-api-compat/**/*.log
          if-no-files-found: warn
          retention-days: 14
