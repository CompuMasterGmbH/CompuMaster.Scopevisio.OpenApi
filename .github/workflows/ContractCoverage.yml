name: Contract Coverage (Offline)

on:
  push:
    paths:
      - 'contracts/openscope/**'
      - 'tools/contract_coverage.py'
      - 'tools/test_contract_coverage.py'
      - 'tools/generate_read_partials.py'
      - 'tools/test_generate_read_partials.py'
      - 'tools/templates/**'
      - 'src/CompuMaster.Scopevisio.OpenApi/**'
      - 'src/CompuMaster.Scopevisio.OpenApi.AsyncTests/**'
      - '.github/workflows/ContractCoverage.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'contracts/openscope/**'
      - 'tools/contract_coverage.py'
      - 'tools/test_contract_coverage.py'
      - 'tools/generate_read_partials.py'
      - 'tools/test_generate_read_partials.py'
      - 'tools/templates/**'
      - 'src/CompuMaster.Scopevisio.OpenApi/**'
      - 'src/CompuMaster.Scopevisio.OpenApi.AsyncTests/**'
      - '.github/workflows/ContractCoverage.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test conservative source extraction
        run: python -m unittest discover -s tools -p test_contract_coverage.py -v
      - name: Test bounded generation and verify reviewed source import
        run: |
          python -m unittest discover -s tools -p test_generate_read_partials.py -v
          python tools/generate_read_partials.py --check-import
      - name: Verify pinned contract and reproducible report
        run: python tools/contract_coverage.py --check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify bounded non-Windows SDK sample and selection policy
        shell: pwsh
        run: |
          ./.github/scripts/test-ci-test-selection.ps1
          dotnet restore src/CompuMaster.Scopevisio.OpenApi.AsyncTests/CompuMaster.Scopevisio.OpenApi.AsyncTests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Isolated sample restore failed.' }
          ./.github/scripts/run-ci-tests.ps1 -RunnerOs $env:RUNNER_OS -Framework net8.0 -ResultsDirectory test-results-offline
      - name: Retain sampled SDK evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-sdk-sample
          path: test-results-offline/
          if-no-files-found: warn
