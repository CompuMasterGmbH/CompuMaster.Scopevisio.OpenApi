name: Contract Coverage (Offline)

on:
  push:
    paths:
      - 'contracts/openscope/**'
      - 'tools/contract_coverage.py'
      - 'tools/test_contract_coverage.py'
      - 'tools/generate_read_partials.py'
      - 'tools/test_generate_read_partials.py'
      - 'tools/templates/**'
      - 'src/CompuMaster.Scopevisio.OpenApi/**'
      - 'src/CompuMaster.Scopevisio.OpenApi.AsyncTests/**'
      - '.github/workflows/ContractCoverage.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'contracts/openscope/**'
      - 'tools/contract_coverage.py'
      - 'tools/test_contract_coverage.py'
      - 'tools/generate_read_partials.py'
      - 'tools/test_generate_read_partials.py'
      - 'tools/templates/**'
      - 'src/CompuMaster.Scopevisio.OpenApi/**'
      - 'src/CompuMaster.Scopevisio.OpenApi.AsyncTests/**'
      - '.github/workflows/ContractCoverage.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test conservative source extraction
        run: python -m unittest discover -s tools -p test_contract_coverage.py -v
      - name: Test bounded generation and verify reviewed source import
        run: |
          python -m unittest discover -s tools -p test_generate_read_partials.py -v
          python tools/generate_read_partials.py --check-import
      - name: Verify pinned contract and reproducible report
        run: python tools/contract_coverage.py --check
      - name: Verify shared secondary SDK selection policy without executing duplicate samples
        shell: pwsh
        run: ./.github/scripts/test-ci-test-selection.ps1
