name: Build and Test

# PREREQUISITES FOR PUSH-BACK OF TEST RESULTS
# Please note: test project usually required nuget package JUnitTestLogger
# to be able to provide JUnit compatible test results XML file (required
# for pushing back details on succeeded/failed tests)
#
# NuGet install command:
# - Install-Package JUnitTestLogger

# Controls when the action will run.
on:
    # Triggers the workflow on push or pull request events but only for the master branch
    push:
        branches: [master]
    pull_request:
        branches: [master]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# This lock is repository-scoped; cross-repository account access still needs coordination.
concurrency:
    group: openscope_test_account
    cancel-in-progress: false

env:
    # Path to the solution file relative to the root of the project
    SOLUTION_FILE_PATH: .

    # Configuration type to build
    BUILD_CONFIGURATION: Debug

    BUILD_OUTPUT: src/CompuMaster.Scopevisio.OpenApi/bin/Debug
    BUILD_OUTPUT_TEST: src/CompuMaster.Scopevisio.OpenApi.Test.NetStandard/bin/Debug

jobs:
    test:
        #needs: build
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]
                include:
                    - os: macos-latest
                      runNetExe: mono
                      sampleResults: test-results-net8.0
                    - os: ubuntu-latest
                      sampleResults: test-results-net8.0
                    - os: windows-latest
                      sampleResults: test-results-net48

        # the build-and-test job might be skipped, we don't need to run this job then
        #if: success() || failure()

        env:
            RESULTS_PATH: TestResults.xml
            TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
            TEST_CUSTOMERNO: ${{ secrets.TEST_CUSTOMERNO }}
            TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET Core
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Dir Listing (Win)
              if: startsWith(matrix.os, 'windows')
              run: dir
            - name: Dir Listing (Linux/Mac)
              if: (!startsWith(matrix.os, 'windows'))
              run: ls -la

            - name: Install dependencies
              shell: pwsh
              run: |
                  dotnet restore
                  if ($LASTEXITCODE -ne 0) { throw 'Solution restore failed.' }
                  dotnet restore src/CompuMaster.Scopevisio.OpenApi.AsyncTests/CompuMaster.Scopevisio.OpenApi.AsyncTests.csproj
                  if ($LASTEXITCODE -ne 0) { throw 'Isolated SDK restore failed.' }

            - name: Validate full and sampled CI selections without account access
              shell: pwsh
              run: ./.github/scripts/test-ci-test-selection.ps1

            - name: Build
              run: dotnet build --configuration=${{env.BUILD_CONFIGURATION}} --no-restore

            - name: Run full Windows or sampled non-Windows tests - .NET 8.0
              shell: pwsh
              run: |
                  if ($env:RUNNER_OS -eq 'Windows') {
                      ./.github/scripts/run-ci-tests.ps1 -RunnerOs Windows -Framework net8.0 -Configuration $env:BUILD_CONFIGURATION -ResultsDirectory test-results-net8.0 -IncludeCredentialedSuite
                  } else {
                      ./.github/scripts/run-ci-tests.ps1 -RunnerOs $env:RUNNER_OS -Framework net8.0 -Configuration $env:BUILD_CONFIGURATION -ResultsDirectory test-results-net8.0
                  }

            - name: Run representative tests - .NET Framework 4.8
              if: (startsWith(matrix.os, 'windows'))
              shell: pwsh
              run: ./.github/scripts/run-ci-tests.ps1 -RunnerOs $env:RUNNER_OS -Framework net48 -Configuration $env:BUILD_CONFIGURATION -ResultsDirectory test-results-net48

#            - name: Dir Listing (Win) test-results
#              if: startsWith(matrix.os, 'windows')
#              run: dir test-results
#            - name: Dir Listing (Linux/Mac) test-results
#              if: (!startsWith(matrix.os, 'windows'))
#              run: ls -la test-results

#            #Following lines maybe required again after test&dev?!
#            #  # the action is useless on pull_request events
#            #  # (it can not create check runs or pull request comments)
#            #  if: always() #&& startsWith(matrix.os, 'ubuntu') #&& github.event_name != 'pull_request'

            - name: Unit Test Results (Linux) - NET 8.0
              uses: EnricoMi/publish-unit-test-result-action@v2
              if: always() && startsWith(matrix.os, 'ubuntu')
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  files: "test-results-net8.0/**/*.trx"
                  check_run_annotations: all tests
                  comment_title: Unit Test Statistics (${{matrix.os}})  - NET 8.0
                  check_name: Unit Test Results (${{matrix.os}})  - NET 8.0
                  report_individual_runs: true

            - name: Unit Test Results (Win/Mac) - NET 8.0
              uses: EnricoMi/publish-unit-test-result-action/composite@v2
              if: always() && (!(startsWith(matrix.os, 'ubuntu')))
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  files: "test-results-net8.0/**/*.trx"
                  check_run_annotations: all tests
                  comment_title: Unit Test Statistics (${{matrix.os}})  - NET 8.0
                  check_name: Unit Test Results (${{matrix.os}})  - NET 8.0
                  report_individual_runs: true

            - name: Publish Unit Test Results (Win) - NET Framework 4.8
              uses: EnricoMi/publish-unit-test-result-action/composite@v2
              if: always() && (startsWith(matrix.os, 'windows'))
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  files: "test-results-net48/**/*.trx"
                  check_run_annotations: all tests
                  comment_title: Unit Test Statistics (${{matrix.os}}) - NET Framework 4.8
                  check_name: Unit Test Results (${{matrix.os}}) - NET Framework 4.8
                  report_individual_runs: true

            - name: Retain full and sampled test evidence
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: openscope-test-evidence-${{ matrix.os }}
                  path: |
                      test-results-net8.0/
                      test-results-net48/
                  if-no-files-found: warn

            - name: Retain allocated secondary evidence for combined admission
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: openscope-secondary-${{ matrix.os }}
                  path: ${{ matrix.sampleResults }}/isolated/
                  if-no-files-found: error

    secondary-budget:
        needs: test
        if: always()
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  pattern: openscope-secondary-*
                  path: test-results-secondary
            - name: Admit at most 20 actual secondary executions across all platforms
              shell: pwsh
              run: ./.github/scripts/assert-ci-sample-matrix.ps1 -Directory test-results-secondary
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: openscope-secondary-matrix-summary
                  path: test-results-secondary/secondary-matrix-summary.json
                  if-no-files-found: warn
